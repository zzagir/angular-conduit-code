@if (tags().length) {
  <div class="tag-list">
    @for (tag of tags(); track tag) {
      <button
        type="button"
        class="tag-pill tag-default"
        [class.tag-primary]="tag === selectedTag()"
        [class.tag-outline]="tag !== selectedTag()"
        (click)="tagSelected.emit(tag)"
      >
        {{ tag }}
      </button>
    }
  </div>
}

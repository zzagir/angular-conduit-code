<form class="card comment-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="card-block">
    <textarea
      formControlName="body"
      class="form-control"
      placeholder="Write a comment..."
      rows="3"
    ></textarea>
  </div>
  <div class="card-footer">
    <img
      [src]="authService.currentUser()?.image || 'https://api.realworld.io/images/smiley-cyrus.jpg'"
      class="comment-author-img"
      alt=""
    />
    <button type="submit" class="btn btn-sm btn-primary" [disabled]="form.invalid">
      Post Comment
    </button>
  </div>
</form>
